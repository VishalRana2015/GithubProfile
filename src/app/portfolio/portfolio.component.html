<div class="min-h-screen min-w-[640px] mx-auto bg-gradient-to-b from-blue-400 to-purple-600">
  <h3 class="text-2xl font-bold text-center">Professional Experience</h3>
  <div class="container mx-auto px-4 py-8">
    <div *ngIf="designations && designations.length > 0">
      <div *ngFor="let designation of designations" class="mb-8 bg-white shadow-lg rounded-lg p-6">
        <h3 class="text-2xl font-bold mb-2">{{ designation.title }}</h3>
        <p class="text-lg"><strong>{{designation.timeline}}</strong></p>

        <div *ngIf="designation.experiences && designation.experiences.length > 0" class="ml-4">
            <div *ngFor="let experience of designation.experiences" class="mt-8">
              <h5 class="text-xl fong-bold mb-1"> {{experience.title}}</h5>
              <p class="text-base font-bold mb-1" *ngIf="experience.timeline"> <strong>{{ experience.timeline}}</strong></p>
              <p class="text-lg pl-2"><strong>Role: </strong> {{experience.role}}</p>
              <div *ngIf="experience.data && experience.data.length > 0" class="ml-6">
                <ul class="list-disc mt-2 pl-4">
                  <span *ngFor ="let item of experience.data" class="text-base">
                    <li *ngIf="item.length != 0" class="text-base">{{item}}</li>
                    <br *ngIf="item.length == 0" />
                  </span>
                </ul>
              </div>
              <div *ngIf="experience.links && experience.links.length > 0" class="list-disc text-blue-800 underline font-mono mt-2 ml-12" >
                <ul class="list-disc pl-4 mt-2">
                  <span *ngFor ="let link of experience.links" class="text-base">
                    <li class="text-base">
                      <a [href]="link.href" [title]="link.text" target="_blank">{{link.text}}</a>
                    </li>
                  </span>
                </ul>
              </div>
            </div>
        </div>
  </div>
</div>
